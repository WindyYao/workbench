<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="theme-color" content="#6366f1">
    <link rel="manifest" href="./manifest.json">
    <link rel="icon" type="image/jpeg" href="https://avatars.githubusercontent.com/u/318936939?v=4">
    <link rel="apple-touch-icon" href="https://avatars.githubusercontent.com/u/318936939?v=4">
    <title>我的工作台</title>
    <style>
        :root {
            --bg: #f0f2f5;
            --card: #fff;
            --ink: #1a1a2e;
            --muted: #6b7280;
            --accent: #6366f1;
            --accent2: #8b5cf6;
            --rule: #e5e7eb;
            --radius: 14px;
            --radius-sm: 8px;
            --shadow: 0 2px 12px rgba(0, 0, 0, 0.1);
        }
        [data-theme="dark"] {
            --bg: #0f1117;
            --card: #1a1d29;
            --ink: #e4e6eb;
            --muted: #8b90a0;
            --accent: #818cf8;
            --accent2: #a78bfa;
            --rule: #2a2d3a;
            --shadow: 0 2px 12px rgba(0, 0, 0, 0.3);
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: var(--bg);
            color: var(--ink);
            transition: background 0.15s, color 0.15s;
            line-height: 1.5;
        }
        input, textarea, select, button {
            font-family: inherit;
            font-size: 16px;
        }
        .dock {
            position: fixed;
            left: 0;
            top: 0;
            bottom: 0;
            width: 64px;
            background: var(--card);
            border-right: 1px solid var(--rule);
            z-index: 100;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 16px 0;
        }
        .dock-brand {
            font-size: 18px;
            margin-bottom: 24px;
            white-space: nowrap;
            writing-mode: vertical-lr;
            font-weight: 700;
            color: var(--accent);
        }
        .dock-item {
            width: 52px;
            padding: 8px 4px;
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            border-radius: 10px;
            margin: 2px 0;
            transition: background 0.15s;
        }
        .dock-item:hover {
            background: var(--accent) 15%;
        }
        .dock-item .active {
            background: var(--accent) 20%;
        }
        .dock-item .active .dock-icon {
            transform: scale(1.1);
        }
        .dock-icon {
            font-size: 20px;
            margin-bottom: 2px;
            transition: transform 0.15s;
        }
        .dock-text {
            font-size: 10px;
            color: var(--muted);
            white-space: nowrap;
        }
        .dock-item .active .dock-text {
            color: var(--accent);
            font-weight: 600;
        }
        .main {
            margin-left: 64px;
            padding: 12px;
            max-width: 1200px;
        }
        @media (max-width: 600px) {
            .main {
                padding: 8px;
            }
            .dock {
                width: 56px;
            }
            .dock-brand {
                font-size: 15px;
            }
            .dock-item {
                width: 48px;
            }
            .dock-icon {
                font-size: 18px;
            }
            .dock-text {
                font-size: 9px;
            }
        }
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
            flex-wrap: wrap;
            gap: 8px;
        }
        .clock-box {
            display: flex;
            gap: 12px;
            align-items: center;
        }
        .clock {
            background: var(--card);
            border-radius: var(--radius-sm);
            padding: 6px 12px;
            box-shadow: var(--shadow);
            text-align: center;
        }
        .clock-label {
            font-size: 10px;
            color: var(--muted);
        }
        .clock-time {
            font-size: 18px;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
            color: var(--accent);
        }
        .header-actions {
            display: flex;
            gap: 6px;
            align-items: center;
        }
        .btn {
            padding: 6px 12px;
            border: 1px solid var(--rule);
            border-radius: var(--radius-sm);
            background: var(--card);
            cursor: pointer;
            color: var(--ink);
            transition: all 0.15s;
            font-size: 14px;
        }
        .btn:hover {
            background: var(--accent) 10%;
            border-color: var(--accent);
        }
        .btn-primary {
            background: var(--accent);
            color: white;
            border-color: var(--accent);
        }
        .btn-primary:hover {
            background: var(--accent2);
            border-color: var(--accent2);
        }
        .card {
            background: var(--card);
            border-radius: var(--radius);
            padding: 16px;
            margin-bottom: 12px;
            box-shadow: var(--shadow);
        }
        .card-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 12px;
            color: var(--ink);
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 12px;
        }
        .vocab-item {
            padding: 12px;
            border: 1px solid var(--rule);
            border-radius: 8px;
            margin-bottom: 8px;
            cursor: pointer;
            transition: all 0.15s;
        }
        .vocab-item:hover {
            border-color: var(--accent);
            transform: translateY(-2px);
            box-shadow: var(--shadow);
        }
        .vocab-word {
            font-size: 18px;
            font-weight: 600;
            color: var(--ink);
            margin-bottom: 4px;
        }
        .vocab-phonetic {
            font-size: 14px;
            color: var(--muted);
            margin-bottom: 8px;
        }
        .vocab-definition {
            font-size: 14px;
            color: var(--ink);
            line-height: 1.4;
        }
        .loading {
            text-align: center;
            padding: 40px;
            color: var(--muted);
        }
        .error {
            background: #fee2e2;
            color: #991b1b;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 12px;
        }
        .cors-warning {
            background: #fef3c7;
            color: #92400e;
            padding: 8px;
            border-radius: 6px;
            margin-bottom: 12px;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div class="dock">
        <div class="dock-brand">Workbench</div>
        <div class="dock-item active" data-tab="dashboard">
            <div class="dock-icon">📊</div>
            <div class="dock-text">仪表板</div>
        </div>
        <div class="dock-item" data-tab="vocab">
            <div class="dock-icon">📚</div>
            <div class="dock-text">词汇</div>
        </div>
        <div class="dock-item" data-tab="settings">
            <div class="dock-icon">⚙️</div>
            <div class="dock-text">设置</div>
        </div>
    </div>
    <div class="main">
        <div id="dashboard" class="tab-content">
            <div class="header">
                <div class="clock-box">
                    <div class="clock">
                        <div class="clock-label">当前时间</div>
                        <div class="clock-time" id="clock">00:00:00</div>
                    </div>
                </div>
                <div class="header-actions">
                    <button class="btn" id="theme-toggle">🌓 切换主题</button>
                </div>
            </div>
            <div class="card">
                <div class="card-title">欢迎使用工作台</div>
                <p>这是一个多功能工作面板，包含词汇学习、时间显示等功能。</p>
            </div>
        </div>
        <div id="vocab" class="tab-content" style="display: none;">
            <div class="header">
                <h2>词汇学习</h2>
                <button class="btn btn-primary" id="load-vocab">加载词汇</button>
            </div>
            <div id="vocab-container" class="grid">
                <div class="loading">暂无词汇数据</div>
            </div>
            <div id="cors-warning" class="cors-warning" style="display: none;"></div>
        </div>
        <div id="settings" class="tab-content" style="display: none;">
            <div class="card">
                <div class="card-title">设置</div>
                <p>在此处配置应用设置。</p>
            </div>
        </div>
    </div>
    <script>
        // 时钟功能
        function updateClock() {
            const now = new Date();
            const timeString = now.toLocaleTimeString('zh-CN', { 
                hour12: false,
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit'
            });
            document.getElementById('clock').textContent = timeString;
        }
        setInterval(updateClock, 1000);
        updateClock();
        
        // 主题切换
        document.getElementById('theme-toggle').addEventListener('click', () => {
            document.body.setAttribute('data-theme', 
                document.body.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
        });
        
        // 标签页切换
        document.querySelectorAll('.dock-item').forEach(item => {
            item.addEventListener('click', () => {
                document.querySelectorAll('.dock-item').forEach(i => i.classList.remove('active'));
                item.classList.add('active');
                const tabId = item.getAttribute('data-tab');
                document.querySelectorAll('.tab-content').forEach(content => {
                    content.style.display = content.id === tabId ? 'block' : 'none';
                });
            });
        });
        
        // 词汇功能 - 修复了大小写问题和toFixed错误
        let vocabulary = [];
        
        async function loadVocabulary() {
            const container = document.getElementById('vocab-container');
            const corsWarning = document.getElementById('cors-warning');
            
            try {
                // 尝试从本地服务器加载
                const response = await fetch('http://localhost:8080/vocab.json');
                
                if (!response.ok) {
                    throw new Error('HTTP error! status: ' + response.status);
                }
                
                const data = await response.json();
                vocabulary = Array.isArray(data) ? data : [];
                
                if (vocabulary.length === 0) {
                    container.innerHTML = '<div class="loading">词汇数据为空</div>';
                    return;
                }
                
                renderVocabulary();
                corsWarning.style.display = 'none';
                
            } catch (error) {
                console.error('加载词汇失败:', error);
                
                // CORS fallback: 使用内嵌的示例数据
                corsWarning.style.display = 'block';
                corsWarning.textContent = '⚠️ 无法连接到本地服务器 (localhost:8080)，使用内嵌示例数据。请确保本地服务器正在运行。';
                
                // 示例词汇数据 - 修复了VOCAB大小写问题
                vocabulary = [
                    { word: 'Apple', phonetic: '/ˈæpl/', definition: '苹果' },
                    { word: 'Banana', phonetic: '/bəˈnænə/', definition: '香蕉' },
                    { word: 'Computer', phonetic: '/kəmˈpjuːtər/', definition: '计算机' },
                    { word: 'Development', phonetic: '/dɪˈvɛləpmənt/', definition: '开发' },
                    { word: 'Engineering', phonetic: '/ˌɛndʒɪˈnɪərɪŋ/', definition: '工程' }
                ];
                
                renderVocabulary();
            }
        }
        
        function renderVocabulary() {
            const container = document.getElementById('vocab-container');
            
            if (vocabulary.length === 0) {
                container.innerHTML = '<div class="loading">暂无词汇数据</div>';
                return;
            }
            
            container.innerHTML = vocabulary.map(item => `
                <div class="vocab-item">
                    <div class="vocab-word">${item.word}</div>
                    <div class="vocab-phonetic">${item.phonetic}</div>
                    <div class="vocab-definition">${item.definition}</div>
                </div>
            `).join('');
        }
        
        // 修复了toFixed错误：添加数字验证
        function formatNumber(num, decimals = 2) {
            if (typeof num !== 'number' || isNaN(num)) {
                return '0.' + '0'.repeat(decimals);
            }
            return num.toFixed(decimals);
        }
        
        document.getElementById('load-vocab').addEventListener('click', loadVocabulary);
        
        // 页面加载时加载词汇
        loadVocabulary();
    </script>
</body>
</html>
